  <text x="1182" y="330" class="s">업종별 방 메시지 · 게시판 글</text>
  <text x="1182" y="356" class="s">답글 · 의뢰 응답</text>
  <text x="1182" y="380" class="cap">채널·훅별 UTM 링크</text>

  <!-- 4 human -->
  <rect x="1180" y="560" width="290" height="150" rx="18" class="human"/>
  <circle cx="1210" cy="592" r="18" fill="#ea580c"/><text x="1210" y="598" text-anchor="middle" class="n">4</text>
  <text x="1240" y="600" class="t">사람이 게시</text>
  <text x="1202" y="640" class="s">아이보스에 직접 등록</text>
  <text x="1202" y="666" class="s">loop log 로 한 줄 기록</text>
  <text x="1202" y="692" class="cap">자동 게시 안 함 (스팸·정지 위험)</text>

  <!-- 5 measure -->
  <rect x="820" y="790" width="290" height="130" rx="18" class="auto"/>
  <circle cx="850" cy="822" r="18" fill="#6366f1"/><text x="850" y="828" text-anchor="middle" class="n">5</text>
  <text x="880" y="830" class="t">측정</text>
  <text x="842" y="870" class="s">조회수 · 좋아요 · 댓글</text>
  <text x="842" y="896" class="cap">+ 고객 반응 · 리드 회신 · UTM</text>

  <!-- 6 learn -->
  <rect x="460" y="620" width="290" height="140" rx="18" class="auto"/>
  <circle cx="490" cy="652" r="18" fill="#6366f1"/><text x="490" y="658" text-anchor="middle" class="n">6</text>
  <text x="520" y="660" class="t">학습</text>
  <text x="482" y="700" class="s">스코어카드 → learnings.md</text>
  <text x="482" y="726" class="cap">숫자로만: 잘 된 것 / 안 된 것</text>
  <text x="482" y="748" class="cap">내일 바꿀 것 1~2개</text>

  <!-- arrows around loop -->
  <path d="M730,280 C760,250 770,235 798,228" class="ln" marker-end="url(#a)"/>
  <path d="M1090,230 C1130,240 1150,255 1160,275" class="ln" marker-end="url(#a)"/>
  <path d="M1310,390 C1320,460 1325,510 1325,556" class="ln" marker-end="url(#h)" stroke="#c2410c"/>
  <path d="M1250,710 C1200,780 1160,820 1112,845" class="ln" marker-end="url(#a)"/>
  <path d="M820,860 C720,850 640,810 610,764" class="ln" marker-end="url(#a)"/>
  <path d="M600,620 C590,520 595,430 605,372" class="ln" marker-end="url(#a)"/>
  <text x="520" y="510" class="cap" transform="rotate(-82 560 500)">다음 날 초안을 바꾼다</text>

  <!-- north star center -->
  <circle cx="955" cy="520" r="150" fill="#0f172a"/>
  <text x="955" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#a5b4fc">NORTH STAR</text>
  <text x="955" y="505" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">진짜 고객 반응 수</text>
  <text x="955" y="540" text-anchor="middle" font-size="16" fill="#cbd5e1">루브릭 통과 마케터의</text>
  <text x="955" y="564" text-anchor="middle" font-size="16" fill="#cbd5e1">댓글 · 쪽지 · 의뢰 회신</text>
  <text x="955" y="604" text-anchor="middle" font-size="14" fill="#94a3b8">봇 · 경쟁사 반응은 세지 않음</text>

  <!-- day 1 facts -->
  <rect x="60" y="560" width="330" height="360" rx="18" class="box"/>
  <text x="84" y="600" class="t">Day 1 (10/24)</text>
  <text x="84" y="642" class="s">판정 11 → 루브릭 통과 7</text>
  <text x="84" y="676" class="s">대행의뢰 리드 5건 모두 통과</text>
  <text x="100" y="702" class="cap">“AEO·GEO 처음, 상담 원함” 대행사 등</text>
  <text x="84" y="740" class="s">AEO·GEO 게시판 글 대부분</text>
  <text x="100" y="766" class="cap">= 경쟁 실행사 홍보 → 탈락</text>
  <text x="84" y="804" class="s">첫 게시: 강남 피부과 리포트</text>
  <text x="100" y="830" class="cap">AEO·GEO 게시판, UTM 포함</text>
  <text x="84" y="874" class="s">초안: 방 6 · 답글 2 · 의뢰 응답 5</text>

  <!-- legend -->
  <rect x="440" y="950" width="22" height="22" rx="5" class="auto"/><text x="472" y="968" class="cap">에이전트 자동 (Python + Claude)</text>
  <rect x="760" y="950" width="22" height="22" rx="5" class="human"/><text x="792" y="968" class="cap">사람 (등록 버튼만)</text>
  <rect x="980" y="950" width="22" height="22" rx="5" class="src"/><text x="1012" y="968" class="cap">입력 소스</text>
</svg>
