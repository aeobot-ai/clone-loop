<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <style>
      .t{font-size:26px;font-weight:700;fill:#0f172a}
      .s{font-size:17px;fill:#334155}
      .n{font-size:15px;font-weight:700;fill:#ffffff}
      .cap{font-size:16px;fill:#64748b}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .auto{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}
      .human{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}
      .src{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5}
      .ln{stroke:#475569;stroke-width:3;fill:none}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="60" y="70" font-size="38" font-weight="800" fill="#0f172a">aeobot × 아이보스 Agentic GTM 루프</text>
  <text x="60" y="108" class="cap">매일 09:00 KST 한 바퀴 · 2026-10-24 ~ 10-31 · github.com/aeobot-ai/clone-loop</text>

  <!-- sources -->
  <rect x="60" y="170" width="300" height="300" rx="18" class="src"/>
  <text x="84" y="210" class="t">재료</text>
  <text x="84" y="250" class="s">• aeobot 블로그 측정 리포트</text>
  <text x="100" y="276" class="cap">피부과 · 수분크림 · 영양제 …</text>
  <text x="84" y="318" class="s">• 아이보스 게시판 5곳</text>
  <text x="100" y="344" class="cap">AEO·GEO · 블로그 · 질문답변</text>
  <text x="100" y="368" class="cap">병의원 · AI</text>
  <text x="84" y="410" class="s">• 대행의뢰 (SEO · AI)</text>
  <text x="100" y="436" class="cap">구매 의도가 있는 리드</text>
  <path d="M360,320 L470,320" class="ln" marker-end="url(#a)"/>

  <!-- loop nodes (circle center 900,560 r≈300) -->
  <!-- 1 collect -->
  <rect x="480" y="250" width="250" height="120" rx="18" class="auto"/>
  <circle cx="510" cy="282" r="18" fill="#6366f1"/><text x="510" y="288" text-anchor="middle" class="n">1</text>
  <text x="540" y="290" class="t">수집</text>
  <text x="502" y="330" class="s">새 글 · 고민 글 · 새 의뢰</text>
  <text x="502" y="354" class="cap">Firecrawl</text>

  <!-- 2 judge -->
  <rect x="800" y="160" width="290" height="140" rx="18" class="auto"/>
  <circle cx="830" cy="192" r="18" fill="#6366f1"/><text x="830" y="198" text-anchor="middle" class="n">2</text>
  <text x="860" y="200" class="t">진짜 고객 판정</text>
  <text x="822" y="240" class="s">루브릭 예/아니오 체크</text>
  <text x="822" y="266" class="cap">마케팅 실무자? 노출 책임?</text>
  <text x="822" y="288" class="cap">경쟁 실행사 홍보글은 탈락</text>

  <!-- 3 drafts -->
  <rect x="1160" y="250" width="300" height="140" rx="18" class="auto"/>
  <circle cx="1190" cy="282" r="18" fill="#6366f1"/><text x="1190" y="288" text-anchor="middle" class="n">3</text>
